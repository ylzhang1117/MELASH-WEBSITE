ens de paiement","Zahlungsarten"],"body":["Bank transfer (T/T) in US dollars\nPayPal\nWestern Union\nAlipay and WeChat Pay on request\nPayment is confirmed before your order is prepared. The pro forma invoice lists the amount and bank details.","Transferencia bancaria (T/T) en dólares estadounidenses\nPayPal\nWestern Union\nAlipay y WeChat Pay bajo petición\nEl pago se confirma antes de preparar el pedido. La factura proforma indica el importe y los datos bancarios.","銀行振込(T/T)・米ドル建て\nPayPal\nウエスタンユニオン\nAlipay・WeChat Payはご希望に応じて対応\nご注文の準備前にお支払いを確認します。金額と振込先はプロフォーマインボイスに記載します。","银行电汇(T/T),美元结算\nPayPal\n西联汇款\n可按需使用支付宝或微信支付\n确认收款后才开始备货。形式发票(PI)上会列明金额和收款账户。","Virement bancaire (T/T) en dollars américains\nPayPal\nWestern Union\nAlipay et WeChat Pay sur demande\nLe paiement est confirmé avant la préparation de votre commande. La facture pro forma indique le montant et les coordonnées bancaires.","Banküberweisung (T/T) in US-Dollar\nPayPal\nWestern Union\nAlipay und WeChat Pay auf Anfrage\nDie Zahlung wird bestätigt, bevor Ihre Bestellung vorbereitet wird. Die Proforma-Rechnung enthält den Betrag und die Bankdaten."]},{"id":"i2","ordered":false,"title":["Shipping methods","Métodos de envío","配送方法","发货方式","Modes de livraison","Versandarten"],"body":["Express courier (DHL, FedEx, UPS), door to door\nAir mail for small, light orders\nAir or sea freight for large orders on request\nShipping cost depends on destination and weight. We confirm it in your quote before you pay.\nA tracking number is sent as soon as your parcel ships.","Mensajería exprés (DHL, FedEx, UPS), puerta a puerta\nCorreo aéreo para pedidos pequeños y ligeros\nFlete aéreo o marítimo para pedidos grandes, bajo petición\nEl coste del envío depende del destino y del peso. Lo confirmamos en su presupuesto antes del pago.\nLe enviamos el número de seguimiento en cuanto sale el paquete.","国際宅配便(DHL・FedEx・UPS)でお届け先まで\n小さく軽い注文はエアメール\n大口注文は航空便・海上輸送をご相談ください\n送料は届け先と重量によって決まります。お支払い前に見積りでご確認いただきます。\n発送後すぐに追跡番号をお知らせします。","国际快递(DHL、FedEx、UPS),送货上门\n小件轻货可选航空小包\n大批量订单可按需选择空运或海运\n运费按目的地和重量计算,付款前会在报价里确认\n发货后第一时间提供物流单号","Transporteur express (DHL, FedEx, UPS), porte à porte\nCourrier aérien pour les petites commandes légères\nFret aérien ou maritime pour les grosses commandes sur demande\nLes frais de livraison dépendent de la destination et du poids. Nous les confirmons dans votre devis avant le paiement.\nUn numéro de suivi est envoyé dès l'expédition de votre colis.","Expresskurier (DHL, FedEx, UPS), Haus-zu-Haus\nLuftpost für kleine, leichte Bestellungen\nLuft- oder Seefracht für große Bestellungen auf Anfrage\nDie Versandkosten hängen von Zielort und Gewicht ab. Wir bestätigen sie in Ihrem Angebot, bevor Sie bezahlen.\nSobald Ihr Paket versendet wird, erhalten Sie eine Sendungsnummer."]},{"id":"i3","ordered":true,"title":["How to order","Cómo pedir","ご注文の流れ","下单流程","Comment commander","So bestellen Sie"],"body":["Browse the collection and send an inquiry with the styles, curls, thicknesses and lengths you need.\nWe reply with prices, minimum order and shipping cost on a pro forma invoice.\nYou pay by your chosen method.\nWe prepare and ship your order, then send the tracking number.","Consulte la colección y envíe su consulta con los estilos, curvados, grosores y longitudes que necesita.\nLe respondemos con precios, pedido mínimo y coste de envío en una factura proforma.\nUsted paga con el método que elija.\nPreparamos y enviamos su pedido y le mandamos el número de seguimiento.","コレクションをご覧のうえ、必要なスタイル・カール・太さ・長さをお問い合わせください。\n価格・最低注文数・送料を記載したプロフォーマインボイスをお送りします。\nご希望の方法でお支払いください。\n商品を準備して発送し、追跡番号をお知らせします。","浏览产品目录,把需要的款式、卷度、粗细和长度发给我们询价。\n我们用形式发票回复价格、起订量和运费。\n您用选定的方式付款。\n我们备货发货,并提供物流单号。","Parcourez la collection et envoyez une demande avec les modèles, courbures, épaisseurs et longueurs souhaités.\nNous répondons avec les prix, la commande minimum et les frais de livraison sur une facture pro forma.\nVous payez par le moyen de paiement choisi.\nNous préparons et expédions votre commande, puis envoyons le numéro de suivi.","Stöbern Sie in der Kollektion und senden Sie eine Anfrage mit den gewünschten Styles, Curls, Stärken und Längen.\nWir antworten mit Preisen, Mindestbestellmenge und Versandkosten auf einer Proforma-Rechnung.\nSie zahlen mit der gewählten Zahlungsart.\nWir bereiten Ihre Bestellung vor, versenden sie und senden Ihnen die Sendungsnummer."]},{"id":"c1","sec":"custom","ordered":false,"title":["What we can customize","Qué podemos personalizar","カスタマイズできるもの","可以定制的内容","Ce que nous pouvons personnaliser","Was wir individualisieren können"],"body":["Your logo on the paper card of each lash tray\nSpecial packaging boxes made to your request\nYour logo on selected tools, such as foam cleanser bottles and foam brushes","Su logo en la tarjeta de papel de cada bandeja de pestañas\nCajas de embalaje especiales según su pedido\nSu logo en herramientas seleccionadas, como frascos de espuma limpiadora y cepillos de espuma","各トレイの紙カードにお客様のロゴを印刷\nご要望に合わせた特別パッケージ\nフォームクレンザーのボトルやフォームブラシなど、一部のツールにもロゴを印刷","每盒睫毛的纸卡可印您的 Logo\n按您的要求制作特殊包装盒\n部分工具也可印 Logo,如泡沫洁面液瓶身和海绵刷","Votre logo sur la carte en papier de chaque plateau de cils\nDes boîtes d'emballage spéciales réalisées selon votre demande\nVotre logo sur certains outils, comme les flacons de nettoyant moussant et les brosses mousse","Ihr Logo auf der Papierkarte jedes Wimpern-Trays\nSonderverpackungen nach Ihren Wünschen\nIhr Logo auf ausgewählten Werkzeugen, z. B. Schaumreiniger-Flaschen und Schaumbürsten"]},{"id":"c2","sec":"custom","ordered":false,"title":["Custom logo costs","Costes del logo personalizado","ロゴ入りの費用","定制 Logo 费用","Coûts du logo personnalisé","Kosten für individuelles Logo"],"body":["Basic paper card: $25 per 500 cards\nGold foil (hot stamping): +$10 per card design\nIf the length is marked on the card, each length counts as one design. A card with only your logo counts as one design.\nSpecial packaging boxes cost extra and are quoted separately\nWe confirm every fee in your quote before you pay","Tarjeta de papel básica: $25 por 500 tarjetas\nEstampado en oro (hot stamping): +$10 por diseño de tarjeta\nSi se marca la longitud en la tarjeta, cada longitud cuenta como un diseño. Una tarjeta solo con su logo cuenta como un diseño.\nLas cajas de embalaje especiales tienen un coste adicional y se presupuestan por separado\nConfirmamos todos los costes en su presupuesto antes del pago","基本の紙カード: 500枚で$25\n金箔押し(ホットスタンプ): カードのデザイン1種類につき+$10\nカードに長さを表示する場合は、長さごとに1デザインとして数えます。ロゴのみのカードは1デザインです。\n特別パッケージは別途費用がかかり、別途お見積りします\nすべての費用はお支払い前に見積りでご確認いただきます","基础纸卡:25 美元 / 500 张\n烫金:每个纸卡款式加收 10 美元\n纸卡上标注长度时,每个长度算一款;只印 Logo、不标长度,算一款\n特殊包装盒另收费用,单独报价\n所有费用会在付款前写进报价,由您确认","Carte en papier de base : $25 pour 500 cartes\nDorure à chaud : +$10 par modèle de carte\nSi la longueur est indiquée sur la carte, chaque longueur compte comme un modèle. Une carte avec uniquement votre logo compte comme un modèle.\nLes boîtes d'emballage spéciales sont facturées en supplément et font l'objet d'un devis séparé\nNous confirmons tous les frais dans votre devis avant le paiement","Einfache Papierkarte: $25 pro 500 Karten\nHeißfolienprägung (Goldfolie): +$10 pro Kartendesign\nWenn die Länge auf der Karte angegeben ist, zählt jede Länge als ein Design. Eine Karte nur mit Ihrem Logo zählt als ein Design.\nSonderverpackungen kosten extra und werden separat angeboten\nWir bestätigen alle Kosten in Ihrem Angebot, bevor Sie bezahlen"]},{"id":"c3","sec":"custom","ordered":true,"title":["How custom orders work","Cómo funcionan los pedidos personalizados","カスタム注文の流れ","定制订单流程","Comment fonctionnent les commandes personnalisées","So funktionieren individuelle Bestellungen"],"body":["Tell us which styles you need and send us your logo file by email\nWe confirm the paper card or box design with you and quote the fees\nOnce you approve the design and the quote, we start production","Díganos qué estilos necesita y envíenos su archivo de logo por correo\nConfirmamos con usted el diseño de la tarjeta o la caja y le presupuestamos los costes\nCuando apruebe el diseño y el presupuesto, empezamos la producción","必要なスタイルをお知らせいただき、ロゴのファイルをメールでお送りください\n紙カードまたは箱のデザインを確認し、費用をお見積りします\nデザインとお見積りをご承認いただいたら、製造を開始します","告诉我们需要的款式,并把 Logo 文件用邮件发给我们\n我们和您确认纸卡或包装盒的设计,并报出费用\n您确认设计和报价后,我们开始生产","Dites-nous quels modèles vous voulez et envoyez-nous votre fichier de logo par e-mail\nNous validons avec vous le design de la carte ou de la boîte et vous communiquons les frais\nUne fois le design et le devis approuvés, nous lançons la production","Teilen Sie uns mit, welche Styles Sie benötigen, und senden Sie uns Ihre Logodatei per E-Mail\nWir stimmen das Design der Papierkarte oder Verpackung mit Ihnen ab und nennen die Kosten\nNach Ihrer Freigabe von Design und Angebot starten wir die Produktion"]}]}</script>

    await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
